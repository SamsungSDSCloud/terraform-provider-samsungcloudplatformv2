name: Acceptance Tests (Scheduled)

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

# 워크플로 단위 중복 실행 방지 (기존과 동일)
concurrency:
  group: acctest-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: acctest (${{ matrix.region }} / ${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.profile.job_timeout }}

    # region + profile 조합으로 잠가야 한다.
    # profile 을 빼면 같은 region 의 두 job 이 서로를 기다리며 직렬화된다.
    concurrency:
      group: acctest-${{ matrix.region }}-${{ matrix.profile.name }}
      cancel-in-progress: false

    strategy:
      # 한쪽 계정의 실패가 다른 쪽을 취소하지 않도록 유지
      fail-fast: false
      matrix:
        region:
          # docs/index.md 기준 올바른 표기는 kr-west1 (main 워크플로의 kr-west-1 은 오타)
          - kr-west1
        profile:
          # 일반 계정 : organization 을 포함한 나머지 전체 (기존 시크릿 그대로)
          - name: general
            mode: exclude
            ak: SCP_TF_ACCESS_KEY
            sk: SCP_TF_SECRET_KEY
            go_timeout: 600m
            job_timeout: 630
          # 별도 계정 : CloudControl / ID Center 만
          - name: cloudcontrol
            mode: include
            ak: SCP_CC_ACCESS_KEY
            sk: SCP_CC_SECRET_KEY
            go_timeout: 60m
            job_timeout: 90

    env:
      TF_ACC: '1'
      SCP_TF_DEFAULT_REGION: ${{ matrix.region }}
      SCP_TF_AUTH_URL: https://iam.e.samsungsdscloud.com/v1
      GOPRIVATE: github.com/SamsungSDSCloud/terraform-sdk-samsungcloudplatformv2
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      GOFLAGS: -mod=mod
      # profile 에 적힌 시크릿 이름으로 동적 조회한다.
      # job 이 profile 당 하나씩이므로 job 전체에서 계정이 단 하나로 고정된다.
      SCP_TF_ACCESS_KEY: ${{ secrets[matrix.profile.ak] }}
      SCP_TF_SECRET_KEY: ${{ secrets[matrix.profile.sk] }}
      MODE: ${{ matrix.profile.mode }}
      GO_TIMEOUT: ${{ matrix.profile.go_timeout }}
      # ── 계정 분리 기준. 여기 한 곳만 고치면 양쪽 job 이 같이 따라간다 ──
      # 이 목록에 해당하는 패키지 = 별도 계정(cloudcontrol profile)
      # 그 외 전부(organization 포함)        = 일반 계정(general profile)
      SEPARATE_PKGS: 'cloudcontrol|iamidentitycenter'
      # 테스트에서 항상 제외 (기존 워크플로와 동일. sweep 에서는 제외하지 않는다)
      TEST_SKIP_PKGS: 'virtualserver|servicewatch'

    steps:
      - uses: actions/checkout@v6

      - name: Unshallow
        run: git fetch --prune --unshallow

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Config Access Token
        run: git config --global url.https://$GH_ACCESS_TOKEN@github.com/.insteadOf https://github.com/

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.*'
          terraform_wrapper: false

      # provider 는 환경변수를 우선 보지만,
      # sweeper(SharedClientForRegion)는 환경변수를 무시하고 ~/.scpconf 만 읽는다.
      # 둘이 어긋나면 "B 계정으로 만들고 A 계정을 지우는" 상태가 되므로 반드시 같이 맞춘다.
      - name: Write SCP config files
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.scpconf"
          chmod 700 "$HOME/.scpconf"
          jq -n --arg ak "$SCP_TF_ACCESS_KEY" --arg sk "$SCP_TF_SECRET_KEY" \
            '{"access-key":$ak,"secret-key":$sk}' > "$HOME/.scpconf/credentials.json"
          jq -n --arg url "$SCP_TF_AUTH_URL" --arg region "$SCP_TF_DEFAULT_REGION" \
            '{"auth-url":$url,"default-region":$region}' > "$HOME/.scpconf/config.json"

      # profile 별 테스트 대상 / sweep 대상을 한 번에 계산한다.
      #  - sweep 대상은 resource.TestMain 이 있는 패키지만 (없으면 -sweep 시 수용테스트가 그대로 돈다)
      #  - servicewatch 는 테스트에서만 제외하고 sweep 에는 남긴다 (dashboard/log_group sweeper 가 등록돼 있음)
      #  - '|| true' 는 grep 에만 걸어서 go list 실패가 묻히지 않게 한다
      - name: Resolve packages
        id: pkgs
        run: |
          set -euo pipefail

          all_test=$(go list ./samsungcloudplatform/service/...)
          all_sweep=$(grep -rl 'resource.TestMain' ./samsungcloudplatform/service \
            | { xargs -r -n1 dirname | sort -u || true; })

          case "$MODE" in
            include)
              test_pkgs=$(printf '%s\n' "$all_test" \
                | { grep -E  "/samsungcloudplatform/service/($SEPARATE_PKGS)(/|$)"  || true; } \
                | { grep -vE "/samsungcloudplatform/service/($TEST_SKIP_PKGS)(/|$)" || true; } \
                | xargs -r echo)
              sweep_pkgs=$(printf '%s\n' "$all_sweep" \
                | { grep -E  "/($SEPARATE_PKGS)$" || true; } \
                | xargs -r echo)
              ;;
            exclude)
              test_pkgs=$(printf '%s\n' "$all_test" \
                | { grep -vE "/samsungcloudplatform/service/($SEPARATE_PKGS)(/|$)"  || true; } \
                | { grep -vE "/samsungcloudplatform/service/($TEST_SKIP_PKGS)(/|$)" || true; } \
                | xargs -r echo)
              sweep_pkgs=$(printf '%s\n' "$all_sweep" \
                | { grep -vE "/($SEPARATE_PKGS)$" || true; } \
                | xargs -r echo)
              ;;
            *)
              echo "::error::unknown mode: $MODE"
              exit 1
              ;;
          esac

          echo "test packages : $test_pkgs"
          echo "sweep packages: $sweep_pkgs"
          echo "test=$test_pkgs"   >> "$GITHUB_OUTPUT"
          echo "sweep=$sweep_pkgs" >> "$GITHUB_OUTPUT"

      - name: Sweep before tests
        if: steps.pkgs.outputs.sweep != ''
        run: go test ${{ steps.pkgs.outputs.sweep }} -v -sweep=${{ matrix.region }} -timeout ${{ env.GO_TIMEOUT }}
        continue-on-error: true

      - name: Run acceptance tests
        if: steps.pkgs.outputs.test != ''
        run: go test ${{ steps.pkgs.outputs.test }} -v -cover -timeout ${{ env.GO_TIMEOUT }}

      - name: Sweep after tests
        if: always() && steps.pkgs.outputs.sweep != ''
        run: go test ${{ steps.pkgs.outputs.sweep }} -v -sweep=${{ matrix.region }} -timeout ${{ env.GO_TIMEOUT }}
        continue-on-error: true
